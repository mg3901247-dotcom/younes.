<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsch Meister | 5000 كلمة ألمانية</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f0f2f5;
        --bg2: #ffffff;
        --card: #ffffff;
        --text: #1a1a2e;
        --text2: #555;
        --text3: #888;
        --accent: #6c5ce7;
        --accent2: #a29bfe;
        --gold: #f39c12;
        --gold2: #f1c40f;
        --green: #00b894;
        --red: #e17055;
        --blue: #0984e3;
        --border: rgba(0, 0, 0, 0.06);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        --shadow2: 0 8px 40px rgba(0, 0, 0, 0.1);
        --glass: rgba(255, 255, 255, 0.7);
        --sidebar-bg: #1a1a2e;
        --sidebar-text: #ccc;
        --sidebar-active: #6c5ce7;
        --radius: 16px;
        --radius2: 12px;
      }

      .dark {
        --bg: #0a0a1a;
        --bg2: #12122a;
        --card: #1a1a3e;
        --text: #e8e8f0;
        --text2: #aaa;
        --text3: #666;
        --border: rgba(255, 255, 255, 0.06);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --shadow2: 0 8px 40px rgba(0, 0, 0, 0.4);
        --glass: rgba(26, 26, 62, 0.8);
        --sidebar-bg: #0d0d20;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        transition: all 0.4s ease;
        overflow-x: hidden;
      }

      /* ===== ANIMATED BACKGROUND ===== */
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-animation .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        animation: float 20s infinite ease-in-out;
      }
      .bg-animation .orb:nth-child(1) {
        width: 500px;
        height: 500px;
        background: var(--accent);
        top: -100px;
        right: -100px;
        animation-delay: 0s;
      }
      .bg-animation .orb:nth-child(2) {
        width: 400px;
        height: 400px;
        background: var(--gold);
        bottom: -100px;
        left: -100px;
        animation-delay: -7s;
      }
      .bg-animation .orb:nth-child(3) {
        width: 300px;
        height: 300px;
        background: var(--green);
        top: 50%;
        left: 50%;
        animation-delay: -14s;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(50px, -80px) scale(1.1);
        }
        50% {
          transform: translate(-30px, 60px) scale(0.9);
        }
        75% {
          transform: translate(70px, 30px) scale(1.05);
        }
      }

      /* ===== LAYOUT ===== */
      .app {
        display: flex;
        min-height: 100vh;
        position: relative;
        z-index: 1;
      }

      /* ===== SIDEBAR ===== */
      .sidebar {
        width: 300px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        padding: 30px 0;
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        z-index: 100;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        box-shadow: -5px 0 30px rgba(0, 0, 0, 0.3);
      }
      .sidebar::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
      }

      .sidebar-header {
        padding: 0 25px 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }
      .sidebar-header .logo {
        font-size: 36px;
        margin-bottom: 5px;
      }
      .sidebar-header h2 {
        font-size: 20px;
        color: #fff;
        font-weight: 800;
        background: linear-gradient(135deg, var(--gold), var(--gold2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sidebar-header p {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
      }

      .sidebar-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 20px 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .stat-box {
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--radius2);
        padding: 12px;
        text-align: center;
      }
      .stat-box .num {
        font-size: 22px;
        font-weight: 800;
        color: var(--gold);
        font-family: "Inter", sans-serif;
      }
      .stat-box .label {
        font-size: 10px;
        color: #666;
        margin-top: 3px;
      }

      .chapter-list {
        flex: 1;
        padding: 15px 0;
      }
      .chapter-list h3 {
        padding: 0 25px;
        font-size: 11px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
      }
      .ch-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 25px;
        cursor: pointer;
        transition: all 0.3s;
        border-right: 3px solid transparent;
        font-size: 13px;
      }
      .ch-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .ch-item.active {
        background: rgba(108, 92, 231, 0.15);
        border-right-color: var(--accent);
        color: #fff;
      }
      .ch-item .ch-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        background: rgba(255, 255, 255, 0.05);
      }
      .ch-item.active .ch-icon {
        background: var(--accent);
      }
      .ch-item .ch-info {
        flex: 1;
      }
      .ch-item .ch-name {
        font-weight: 600;
        font-size: 13px;
      }
      .ch-item .ch-count {
        font-size: 10px;
        color: #555;
      }
      .ch-item .ch-progress {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        margin-top: 5px;
        overflow: hidden;
      }
      .ch-item .ch-progress-fill {
        height: 100%;
        background: var(--green);
        border-radius: 10px;
        transition: width 0.5s;
      }

      /* ===== MAIN CONTENT ===== */
      .main {
        flex: 1;
        margin-right: 300px;
        padding: 30px;
        min-height: 100vh;
      }

      /* Top Bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }
      .menu-btn {
        display: none;
        width: 45px;
        height: 45px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 20px;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
      }
      .search-box {
        flex: 1;
        min-width: 250px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 14px 20px 14px 50px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 14px;
        font-size: 15px;
        color: var(--text);
        font-family: "Cairo";
        outline: none;
        transition: all 0.3s;
        box-shadow: var(--shadow);
      }
      .search-box input:focus {
        border-color: var(--accent);
      }
      .search-box .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: var(--text3);
      }
      .topbar-btns {
        display: flex;
        gap: 10px;
      }
      .t-btn {
        width: 45px;
        height: 45px;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow);
        transition: all 0.3s;
      }
      .t-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow2);
      }

      /* Chapter Header */
      .chapter-header {
        background: var(--card);
        border-radius: var(--radius);
        padding: 35px;
        margin-bottom: 25px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      .chapter-header::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--accent),
          var(--gold),
          var(--green)
        );
      }
      .chapter-header .ch-emoji {
        font-size: 50px;
        margin-bottom: 10px;
      }
      .chapter-header h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .chapter-header p {
        color: var(--text2);
        font-size: 14px;
      }
      .chapter-header .ch-meta {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        flex-wrap: wrap;
      }
      .chapter-header .ch-meta span {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text3);
        background: var(--bg);
        padding: 6px 14px;
        border-radius: 20px;
      }

      /* Progress Section */
      .progress-section {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px 25px;
        margin-bottom: 25px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
      }
      .progress-section .prog-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 13px;
        font-weight: 600;
      }
      .progress-section .prog-bar {
        width: 100%;
        height: 10px;
        background: var(--bg);
        border-radius: 10px;
        overflow: hidden;
      }
      .progress-section .prog-fill {
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--accent), var(--green));
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* View Toggle */
      .view-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .v-btn {
        padding: 8px 18px;
        border-radius: 10px;
        border: 2px solid var(--border);
        background: var(--card);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        transition: all 0.3s;
        font-family: "Cairo";
      }
      .v-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* ===== WORD CARDS ===== */
      .words-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 18px;
      }
      .words-grid.list-view {
        grid-template-columns: 1fr;
      }

      .word-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        animation: cardIn 0.5s ease backwards;
      }
      .word-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow2);
        border-color: var(--accent2);
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .word-card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 4px;
        height: 100%;
        background: var(--accent);
        border-radius: 0 4px 4px 0;
      }
      .word-card .wc-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .word-card .wc-de {
        font-family: "Inter", sans-serif;
        font-size: 26px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: -0.5px;
      }
      .dark .word-card .wc-de {
        color: var(--accent2);
      }
      .word-card .wc-type {
        padding: 4px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        background: rgba(108, 92, 231, 0.1);
        color: var(--accent);
      }
      .word-card .wc-ar {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .word-card .wc-pron {
        font-size: 13px;
        color: var(--text3);
        margin-bottom: 12px;
        font-style: italic;
      }
      .word-card .wc-example {
        background: var(--bg);
        border-radius: var(--radius2);
        padding: 12px 15px;
        border-right: 3px solid var(--gold);
      }
      .word-card .wc-ex-de {
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--blue);
        margin-bottom: 4px;
      }
      .word-card .wc-ex-ar {
        font-size: 13px;
        color: var(--text2);
      }
      .word-card .wc-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .wc-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }
      .wc-btn:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .wc-btn.saved {
        background: var(--gold);
        color: #fff;
        border-color: var(--gold);
      }

      /* List view card */
      .list-view .word-card {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px 24px;
      }
      .list-view .word-card .wc-top {
        margin-bottom: 0;
        flex: 0 0 auto;
      }
      .list-view .word-card .wc-de {
        font-size: 22px;
      }
      .list-view .word-card .wc-example {
        flex: 1;
        margin: 0;
      }
      .list-view .word-card .wc-actions {
        margin-top: 0;
      }

      /* ===== MODAL ===== */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        background: var(--card);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: var(--shadow2);
        text-align: center;
        animation: modalIn 0.4s ease;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .modal h2 {
        font-size: 24px;
        margin-bottom: 10px;
      }
      .modal p {
        color: var(--text2);
        margin-bottom: 20px;
      }
      .modal .big-word {
        font-family: "Inter";
        font-size: 48px;
        font-weight: 800;
        color: var(--accent);
        margin: 20px 0;
      }
      .modal .modal-ar {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .modal .modal-close {
        padding: 12px 30px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        font-family: "Cairo";
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 900px) {
        .sidebar {
          transform: translateX(100%);
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .main {
          margin-right: 0;
        }
        .menu-btn {
          display: flex;
        }
        .words-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 500px) {
        .main {
          padding: 15px;
        }
        .chapter-header {
          padding: 20px;
        }
        .chapter-header h1 {
          font-size: 22px;
        }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent2);
        border-radius: 10px;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: #fff;
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
        z-index: 2000;
        opacity: 0;
        transition: all 0.4s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(-10px);
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <div class="orb"></div>
      <div class="orb"></div>
      <div class="orb"></div>
    </div>

    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">🇩🇪</div>
          <h2>Deutsch Meister</h2>
          <p>5000 كلمة ألمانية | من الصفر للاحتراف</p>
        </div>
        <div class="sidebar-stats">
          <div class="stat-box">
            <div class="num" id="totalWords">0</div>
            <div class="label">كلمة</div>
          </div>
          <div class="stat-box">
            <div class="num" id="savedCount">0</div>
            <div class="label">محفوظة ⭐</div>
          </div>
        </div>
        <div class="chapter-list">
          <h3>📚 الفصول</h3>
          <div id="chapterList"></div>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <div class="topbar">
          <button class="menu-btn" onclick="toggleSidebar()">☰</button>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="searchInput"
              placeholder="ابحث عن كلمة ألمانية أو عربية..."
              oninput="handleSearch()"
            />
          </div>
          <div class="topbar-btns">
            <button class="t-btn" onclick="toggleDark()" title="الوضع الليلي">
              🌙
            </button>
            <button class="t-btn" onclick="showSaved()" title="المحفوظات">
              ⭐
            </button>
            <button class="t-btn" onclick="exportData()" title="تصدير">
              📥
            </button>
          </div>
        </div>

        <div id="chapterHeader"></div>
        <div class="progress-section">
          <div class="prog-header">
            <span>التقدم في هذا الفصل</span>
            <span id="progPercent">0%</span>
          </div>
          <div class="prog-bar">
            <div class="prog-fill" id="progFill" style="width: 0%"></div>
          </div>
        </div>

        <div class="view-toggle">
          <button class="v-btn active" onclick="setView('grid', this)">
            ▦ شبكة
          </button>
          <button class="v-btn" onclick="setView('list', this)">
            ☰ قائمة
          </button>
        </div>

        <div class="words-grid" id="wordsGrid"></div>
      </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
      <div class="modal">
        <div class="big-word" id="modalDe"></div>
        <div class="modal-ar" id="modalAr"></div>
        <p id="modalPron"></p>
        <div
          id="modalExample"
          style="text-align: right; margin-bottom: 20px"
        ></div>
        <button
          class="modal-close"
          onclick="document.getElementById('modal').classList.remove('show')"
        >
          إغلاق
        </button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <audio id="bgMusic" preload="auto"></audio>

    <script>
      (function () {
        const bgMusic = document.getElementById("bgMusic");
        const songs = [
          "song13.mp3",
          "song6.mp3",
          "song11.mp3",
          "song4.mp3",
          "song12.mp3",
          "song5.mp3",
          "song1.mp3",
          "song8.mp3",
          "song9.mp3",
          "song10.mp3",
          "song2.mp3",
          "song13.mp3",
        ];
        let currentIndex = 0;
        let musicStarted = false;

        function playCurrent() {
          bgMusic.src = songs[currentIndex];
          bgMusic.volume = 1.0;
          bgMusic.play().catch((err) => console.error("❌ خطأ:", err));
          console.log(`🎶 شغالة: ${songs[currentIndex]}`);
        }

        bgMusic.addEventListener("ended", function () {
          currentIndex++;
          if (currentIndex >= songs.length) currentIndex = 0;
          playCurrent();
        });

        function startMusic() {
          if (musicStarted) return;
          playCurrent();
          musicStarted = true;
          document.removeEventListener("click", startMusic);
          document.removeEventListener("keydown", startMusic);
          document.removeEventListener("touchstart", startMusic);
        }

        document.addEventListener("click", startMusic);
        document.addEventListener("keydown", startMusic);
        document.addEventListener("touchstart", startMusic);
      })();
    </script>

  </body>
